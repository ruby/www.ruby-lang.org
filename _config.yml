markdown: kramdown
permalink: pretty
highlighter: rouge

timezone: UTC

kramdown:
  auto_ids: true  # Enable auto IDs for TOC links

include:
  - _headers

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - lib
  - test
  - vendor
  - CLAUDE.md

# Pagefind builds one search index per language and the browser picks one by the
# `lang` of the page it is on. Pagefind has neither word stemming nor interface
# translations for the languages under `unsupported`, so their pages are left
# out of the index and their search runs against `fallback` instead. Both the
# layouts and lib/search_index.rb read these keys.
search:
  fallback: en
  unsupported:
    - bg

url: https://www.ruby-lang.org

license:
  url: /en/about/license.txt

svn:
  stable:
    version: 2.6
    branch:  ruby_2_6
  previous:
    version: 2.5
    branch:  ruby_2_5
  old:
    version: 2.4
    branch:  ruby_2_4
